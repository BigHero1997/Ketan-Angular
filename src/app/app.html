@for (item of numbers; track $index) {
    <div>
        <strong>{{item}}</strong>

        <span>Index : {{ $index }}</span>
        <span>|Even : {{ $even }}</span>
        <span>|Odd : {{ $odd }}</span>
        <span>|first : {{ $first }}</span>
        <span>|Last : {{ $last }}</span>
        <span>|count : {{ $count }}</span>
    </div>
}
