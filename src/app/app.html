<!-- click event -->
<button (click)="handleClick()">Click Me</button>


<!-- input event -->
 <input (input)="handleInput($event)" placeholder="type something">
<!-- key up event -->
 <input (keyup)="handleKeyUp($event)" placeholder="type something">

 <!-- mouse hover event and mouse leave event -->

 <div (mouseover)="handleMouseHover()" (mouseleave)="handleMouseLeave()" class="mouse-hover">Mouse Hover</div>


 <!-- blur event -->
 <input (blur)="handleBlur()" (focus)="handleFocus()" placeholder="type something and then click outside">
